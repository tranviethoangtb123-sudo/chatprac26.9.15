# 推送到 main 分支后，自动打包并发布到 GitHub Pages
# 发布内容 = tools/build-dist.js 产出的 dist/（只含网站运行需要的 19 个文件）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 自检 + 测试 + 打包（都不需要联网，也不依赖第三方 npm 包）
      # 图标是提交进仓库的现成文件（生成脚本需要 Windows 的字体渲染，CI 里不跑）
      # 六套测试都必须过：其中 daily / sync / dialogue / gist 四套专门守着「进度记忆」，
      # 改坏「关掉再打开进度还在 / 跨天不清记忆 / 换手机能拿回进度」就会在这里挡下来，不会发布出去。
      - name: 检查与打包
        run: |
          node tests/selfcheck.js
          node tests/smoke.js
          node tests/daily.js
          node tests/sync.js
          node tests/dialogue.js
          node tests/gist.js
          node tools/build-dist.js

      # 注意：GitHub 不允许 workflow 用 GITHUB_TOKEN 自己开通 Pages
      # （会报 "Resource not accessible by integration"）。
      # 所以 Pages 需要人工在 Settings → Pages → Source 里选一次 "GitHub Actions"，之后就不用再管。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
